name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One row on purpose. The go directive says 1.27, so GOTOOLCHAIN=auto makes an older
        # runner download 1.27 and test the exact same toolchain — extra rows cost minutes and
        # prove nothing. Add a row back only if the directive drops below the runner version.
        go: ['1.27']

    # TestCRUD skips silently without DATABASE_URL, and a skipped test still reads as "ok".
    # This service container is what stops the only test that proves anything from rotting into
    # a permanent skip that nobody notices.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      # sslmode=disable because the service container speaks plain TCP. pg.ParseURL maps it to a
      # nil TLSConfig; anything other than its three known parameters is a hard parse error.
      - name: go test
        run: go test -race -count=1 ./...
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable

      - name: confirm the DB-backed test actually ran
        run: |
          go test -v -count=1 -run TestCRUD ./tests/ | tee out.txt
          grep -q -- '--- PASS: TestCRUD' out.txt \
            || { echo "::error::TestCRUD did not run — it skipped, and a skip reads as ok"; exit 1; }
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27'
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.1

  # Both modules: they have different dependency graphs, since the example pulls in gqlgen's CLI
  # through its tool directive. luima's whole job is wiring four other libraries together, so a
  # known vulnerability in any of them is luima's problem whether or not luima's own code changed —
  # which also means this job can start failing on a commit that changed nothing.
  audit:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27'
          # Load-bearing here specifically: most of what govulncheck reports for this module is
          # the standard library, and "fixed in" means a toolchain patch release. Pinned to the
          # minor without this, the job reports every stdlib CVE since .0 and never goes green.
          check-latest: true
      - name: govulncheck the library
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: govulncheck the example
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
        working-directory: examples/quickstart

  example:
    name: example
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/quickstart
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27'

      - name: build
        run: go build ./...

      # A stub compiles and panics at runtime, so this grep — not go build — is the schema check.
      - name: no unfilled resolver stubs
        run: |
          if grep -rn 'not implemented' graph/*.resolvers.go; then
            echo "::error::unfilled resolver stubs — these COMPILE and panic at runtime"; exit 1
          fi

      # Proves the committed generated code still matches schema.graphqls.
      - name: generated code is up to date
        run: |
          go tool gqlgen generate
          git diff --exit-code -- . \
            || { echo "::error::run 'go tool gqlgen generate' and commit the result"; exit 1; }

      # The half of luimagen that shells out to gqlgen and rewrites its real output cannot be
      # reached by luimagen/internal_test.go, which is deliberately no-exec — two naming bugs sat
      # under a green suite for exactly that reason. This is the only job with gqlgen available as
      # a tool, and a scratch copy is the only place a round trip can run, since Generate rewrites
      # the schema, the model directory and the resolver file in place. ApiKey rather than User on
      # purpose: gqlgen renames ApiKeyInput to APIKeyInput and OwnerId to OwnerID through
      # templates.ToGo, and that drift is what this catches.
      - name: luimagen round trip
        working-directory: ${{ github.workspace }}
        run: |
          scratch="$RUNNER_TEMP/luimagen-roundtrip"
          rm -rf "$scratch" && mkdir -p "$scratch"
          # Through a file, not a pipe: bash -e only checks the last command in a pipeline, so a
          # producing tar that died partway would leave a truncated copy nothing here notices.
          tar -cf "$RUNNER_TEMP/repo.tar" --exclude=.git .
          tar -xf "$RUNNER_TEMP/repo.tar" -C "$scratch"
          cd "$scratch/examples/quickstart"
          go run github.com/ulas96/luima/cmd/luimagen -type ApiKey -table api_keys \
            -field ApiKeyID:string:pk -field OwnerId:string -field 'Scopes:[]string'
          go build ./...
          go vet ./...
          if grep -rn 'not implemented' graph/*.resolvers.go; then
            echo "::error::luimagen left an unfilled stub — these COMPILE and panic at runtime"
            exit 1
          fi
