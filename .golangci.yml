version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - revive
    # Flags every type assertion and every == comparison on an error, so the one place luima wants
    # an assertion rather than errors.As carries a nolint and has to be argued for in the comment
    # above it — which is exactly the review this file wants forced. That distinction is one of the
    # three checks in luimaerr.PresentError's pass-through: errors.As walks the chain, so matching
    # *gqlerror.Error with it lets any resolver bypass redaction by wrapping one.
    - errorlint

  settings:
    revive:
      rules:
        - name: exported
          disabled: false
        - name: package-comments
          disabled: false

  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      # Examples are documentation. A deliberately-nil *bun.DB and an unchecked Close are what
      # keeps them readable on pkg.go.dev.
      - path: example_test\.go$
        linters: [errcheck, staticcheck]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      # examples/quickstart is deliberately outside all of this. It is a separate module, and both
      # `make lint` and CI's lint job run golangci-lint at the repo root, which never descends into
      # it. Pointing a second run at it would fail on graph/schema.resolvers.go: gqlgen owns that
      # file and writes luima's own imports in the same group as everyone else's, which this
      # local-prefixes rule rejects — and hand-formatting it is not open either, because the example
      # job re-runs `go tool gqlgen generate` and fails on any diff.
      local-prefixes:
        - github.com/ulas96/luima

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
